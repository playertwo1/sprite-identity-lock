name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Run documented example
        run: python scripts/sprite_audit.py --manifest examples/minimal/character-lock.json --frames-dir examples/minimal/frames --out-dir out/demo-audit --fps 6
      - name: Verify example status
        run: python -c "import json; from pathlib import Path; assert json.loads(Path('out/demo-audit/report.json').read_text(encoding='utf-8'))['status'] == 'PASS'"
