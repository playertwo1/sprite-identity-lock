name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Run documented example
        run: python scripts/sprite_audit.py --manifest examples/minimal/character-lock.json --frames-dir examples/minimal/frames --out-dir out/demo-audit --fps 6
      - name: Verify example status
        run: python -c "import json; from pathlib import Path; assert json.loads(Path('out/demo-audit/report.json').read_text(encoding='utf-8'))['status'] == 'PASS'"
